f the lowest-paid one-third of workers in the selected occupation and location. It is an entry wage proxy, not observed pay by years of experience."},{"publisher":"U.S. Bureau of Labor Statistics via O*NET OnLine","title":"OEWS May 2025","url":"https://www.onetonline.org/link/localwages/43-3031.00?st=TX","role":"Local wage anchor; all experience ratios are Fieldguide assumptions."},{"publisher":"U.S. Bureau of Labor Statistics","title":"How to use occupational wages","url":"https://www.bls.gov/oes/earnings.htm","role":"Wage variation guidance; does not publish experience-year estimates."}],"evidence":[],"missing":["Would you like to learn to keep an organization’s records of money coming in and going out, using bookkeeping tools you would be taught?","Would you like to learn to check business bills, payments, and account entries and correct records that do not add up?"],"contrary":[],"linkedPathways":[{"id":"accounting","title":"Accounting","courses":["Financial accounting","Managerial accounting","Business law"],"programs":[{"cip":"52.0302","title":"Accounting Technology/Technician and Bookkeeping","stage":"program"}]}]},{"id":"av-technician","title":"Audio & video technicians","rank":24,"level":0,"mixed":false,"fitLevel":"overlap","correlation":0.287375,"entry":41966,"year5":48378,"fields":["Design & creativity","Technology & data"],"routes":[{"key":"program","label":"Technical training or experience; some employers require college","primary":true}],"memberships":["training"],"requiresExperience":false,"variableHours":false,"entryBasis":"Lower-paid-worker wage proxy · after qualification","geography":"Austin metro","period":"2025","requirement":"Subject, method and distinctive responsibility need independent support.","payNotes":["Lower-paid-worker proxy, not measured starting salary; five-year modeled scenario","Required preparation and credentials come before qualified-role pay.","Employee wage proxy; not a guaranteed offer or validated earnings by experience."] <script>
(()=>{
const root=document.getElementById('a3-actual-routes'),view=document.getElementById('a3-view'),picker=document.getElementById('a3-model'),data=JSON.parse(document.getElementById('a3-recorded-data').textContent);
const routeLabels={degree:'Bachelor’s / graduate',associate:'Associate degree',training:'Training / certificate',work:'No college degree'};
const state={model:'scale056-0115',career:null};
const h=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
const current=()=>data.models.find(m=>m.id===state.model)||data.models[0];
const fit=c=>`<span class="a-chip ${c.level>0?'a-top':''}">${c.level===2?'✓ Top':c.level===1?'✓ Supported':'? Explore'}</span>`;
const gap=(c,m)=>{const d=Math.round(c.entry-m.lifestyle.target);return `<span class="a-gap ${d<0?'a-below':''}">${d<0?'−':'+'}${money(Math.abs(d))} ${d<0?'short':'above'}</span>`};
const careerButton=c=>`<button type="button" data-career="${h(c.id)}" class="a-text-button a-career-title cursor-interaction">${h(c.title)}</button>`;
const order=(a,b)=>b.level-a.level||(b.correlation??-2)-(a.correlation??-2)||a.rank-b.rank;
function route(m,key){const cs=m.offers.filter(c=>c.memberships.includes(key)).sort(order),c=cs[0],top=cs.filter(c=>c.level===2).length,supported=cs.filter(c=>c.level===1).length,explore=cs.filter(c=>c.level===0).length;return `<section class="a-lane" aria-label="${routeLabels[key]}"><div class="a-lane-main"><div class="a-route-label"><div class="a-lane-title">${routeLabels[key]}</div><span class="a-small a-muted">${cs.length} ${cs.length===1?'career':'careers'}</span></div>${c?`<div>${careerButton(c)}${fit(c)} ${c.mixed?'<span class="a-small a-muted">Mixed answers</span>':''}${key==='degree'&&c.linkedPathways[0]?`<div class="a-study">Study: <button type="button" class="a-text-button cursor-interaction" data-career="${h(c.id)}">${h(c.linkedPathways[0].title)}</button></div>`:''}</div><div class="a-pay"><strong>${money(c.entry)}</strong><span class="a-small a-muted">estimated / year</span><br>${gap(c,m)}</div>`:'<div class="a-empty">No returned career in this route.</div>'}</div>${cs.length?`<details><summary>${top?`${top} Top · `:''}${supported?`${supported} supported · `:''}${explore} Explore — see all</summary><div class="a-scroll"><table><thead><tr><th>Career</th><th>Evidence</th><th>Est. annual pay</th><th>Vs. target</th></tr></thead><tbody>${cs.map(x=>`<tr><td><button type="button" class="a-text-button cursor-interaction" data-career="${h(x.id)}">${h(x.title)}</button><div class="a-small a-muted">${h(x.fields.join(' · '))}</div></td><td>${fit(x)}</td><td class="a-numeric">${money(x.entry)}</td><td class="a-numeric">${gap(x,m)}</td></tr>`).join('')}</tbody></table></div></details>`:''}</section>`}
function source(m){return `<details class="a-source"><summary>Results & route notes</summary><p>${h(m.armLabel)} · Saved ${h(data.recordedAt.slice(0,10))}. All three are development models; no holdout has been merged or rerun.</p><p>Career status, pay and lifestyle targets come from the saved run and were checked against its exact answers. Route leads are displayed by support, then broad interest alignment. No career is promoted by this layout.</p><p>Some careers have multiple routes; route counts overlap. Training includes apprenticeships and technical programs with varying credentials. Original route descriptions remain in career details.</p><p>Study links use existing occupation-to-program connections from Approach 2, ordered using the same 60 interest answers. They are related study options, not new career confirmations. No subject-reflection answers were invented.</p><p>Pay is a recorded planning estimate for a qualified role, before tax. It is not a job offer. Experience prerequisites and wage-source limitations remain visible in career details.</p><a href="${h(m.sourceURL)}" target="_blank" rel="noopener">Open the recorded model journey ↗</a></details>`}
function overview(m){return `<div class="a-intro"><div><span class="a-eyebrow">${h(m.scenario.toUpperCase())} · RESEARCH MODEL</span><h1>${h(m.name.split(' ')[0])}’s options</h1><span class="a-small a-muted">Fresh 60 interests + ${m.asked} follow-ups</span></div><aside class="a-target"><span>NEEDED FOR SELECTED LIFESTYLE</span><div><strong>${money(m.lifestyle.target)}</strong><small> / year</small></div></aside></div><div class="a-statusline"><strong>${m.top} Top</strong><span>${m.other?m.other+' other supported · ':''}${m.explore} Explore</span><span class="a-muted">${m.unknown} follow-ups unknown</span></div>${m.top===0?'<p class="a-top-note">No confirmed Top yet. These are options to investigate.</p>':m.offers.every(c=>c.entry<m.lifestyle.target)?'<p class="a-top-note">None of these entry-pay estimates reaches this lifestyle target.</p>':''}<div class="a-list">${['degree','associate','training','work'].map(key=>route(m,key)).join('')}</div><p class="a-small a-muted" style="margin-top:12px">${m.offers.length} distinct careers · Open a row to see every option.</p>${source(m)}`}
function detail(m,c){const positive=c.evidence.filter(x=>x.kind==='specific').concat(c.evidence.filter(x=>x.kind!=='specific')).slice(0,3);return `<button type="button" class="a-text-button a-back cursor-interaction" data-back>← ${h(m.name.split(' ')[0])}’s route overview</button><div>${fit(c)} ${c.requiresExperience?'<span class="a-small a-muted">Related experience usually required</span>':''}</div><h1>${h(c.title)}</h1><p class="a-small a-muted">${h(c.routes.map(r=>r.label).join(' · '))}</p><div class="a-detail-pay"><div><span class="a-small a-muted">Estimated annual pay</span><br><strong>${money(c.entry)}</strong></div><div><span class="a-small a-muted">Lifestyle target</span><br><strong>${money(m.lifestyle.target)}</strong></div>${gap(c,m)}</div><div class="a-grid"><section class="a-detail"><h2>${c.level?'Why it is supported':'What still needs checking'}</h2>${positive.length?'<ul>'+positive.map(e=>'<li>'+h(e.text)+'</li>').join('')+'</ul>':'<p>No career-specific supporting answers were recorded.</p>'}${c.missing.length?`<details open><summary>Unresolved interests</summary><ul>${c.missing.slice(0,3).map(q=>'<li>'+h(q)+'</li>').join('')}</ul></details>`:''}${c.contrary.length?`<details open><summary>Contrary answers to consider</summary><ul>${c.contrary.map(q=>'<li>'+h(q)+'</li>').join('')}</ul></details>`:''}<details><summary>Support rule</summary><p>${h(c.requirement)}</p><p class="a-small">Broad interest alignment: ${c.fitLevel==='best'?'Best':c.fitLevel==='good'?'Good':c.fitLevel==='overlap'?'Some overlap':'Explore further'}. This is distinct from specific career support.</p></details></section><section class="a-detail"><h2>Related study & preparation</h2>${c.linkedPathways.length?c.linkedPathways.slice(0,3).map(p=>`<div class="a-path"><strong>${h(p.title)}</strong><p class="a-small a-muted">${h(p.courses.slice(0,3).join(' · '))}</p><details><summary>Linked program categories</summary><ul>${p.programs.slice(0,3).map(q=>`<li>${h(q.title)} <span class="a-small a-muted">CIP ${h(q.cip)}</span></li>`).join('')}</ul></details></div>`).join(''):'<p>No exact study-pathway link was found in the existing Approach 2 inventory.</p>'}<p class="a-small a-muted">A study connection does not confirm career fit or guarantee qualification.</p><details><summary>Original preparation routes</summary>${c.routes.map(r=>`<p><strong>${h(r.label)}</strong><br>${h(r.detail||'Check the specific training and employer requirements.')}</p>`).join('')}</details></section></div><details class="a-source"><summary>Pay sources & five-year scenario</summary><p>${h(c.entryBasis)} · ${h(c.geography)} · ${h(c.period)}</p><p>After five working years: ${money(c.year5)} / year — the existing planning scenario, not measured five-year earnings. Required preparation comes first.</p>${c.variableHours?'<p>Hours, self-employment and unpaid gaps can change annual income.</p>':''}<ul>${c.payNotes.slice(0,3).map(n=>'<li>'+h(n)+'</li>').join('')}</ul>${c.paySources.slice(0,3).map(p=>`<p><a href="${h(p.url)}" target="_blank" rel="noopener">${h(p.publisher)} · ${h(p.title)} ↗</a></p>`).join('')}</details><div class="a-step"><button type="button" data-back class="cursor-interaction">Back to all routes</button><a href="${h(m.sourceURL)}" target="_blank" rel="noopener">Recorded answers & results ↗</a></div>`}
function render(){const m=current();picker.value=m.id;const c=m.offers.find(c=>c.id===state.career);view.innerHTML=c?detail(m,c):overview(m);}
function restore(x){if(!x||x.design!=='a3-actual-routes-v1')return;if(data.models.some(m=>m.id===x.model))state.model=x.model;state.career=current().offers.some(c=>c.id===x.career)?x.career:null;}
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{design:'a3-actual-routes-v1',model:state.model,career:state.career,sourceArm:'current-control-104'},privateContent:null}).catch(()=>{});}
restore(window.openai?.widgetState?.modelContent);render();
picker.addEventListener('change',()=>{state.model=picker.value;state.career=null;render();save();});
view.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-back')){state.career=null;render();save();}else if(b.dataset.career){state.career=b.dataset.career;render();save();}});
window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState?.modelContent);render();});
if(globalThis.Tweak){const appearance={studyLinks:true};const tweak=new Tweak({container:root,onChange:()=>root.classList.toggle('a-quiet-study',!appearance.studyLinks)});tweak.addToggle(appearance,'studyLinks',{label:'Show study link on overview'});}
})();
</script>
</div>
