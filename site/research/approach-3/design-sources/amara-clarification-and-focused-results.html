 an illustrative shortlist screen, not a validated match rule or an engine change."},"validation":{"unaskedQuestionIdsVerified":true,"questionWordingExact":true,"previewOutcomesReadOnly":25,"unknownsNotImputed":true,"prototypeWrites":0}}</script>
<script>
(()=>{
const root=document.getElementById('a3-clarify'),view=document.getElementById('clarify-view'),scene=document.getElementById('clarify-scene'),data=JSON.parse(document.getElementById('clarify-records').textContent);
const state={scene:'amara',step:0,answers:[null,null],done:false,career:null};
const h=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
const responses={yes:'Yes, I would like to learn this work',no:'This work does not interest me',unsure:'Not sure',unfamiliar:'I haven’t tried this',skipped:'Skipped'};
function amara(){if(state.done)return completion();const q=data.amara.questions[state.step];return `<span class="f-kicker">AMARA · OPTIONAL CLARIFICATION</span><h1>What would clarify this?</h1><p class="f-muted">Two unanswered interests about animation.</p><div class="f-question"><div class="f-step">Question ${state.step+1} of 2 · 2 extra checks in this preview</div><h2>${h(q.prompt)}</h2><div class="f-options" role="radiogroup" aria-label="Interest response">${['yes','no','unsure','unfamiliar'].map(v=>`<label class="f-option"><input type="radio" name="clarify-answer" value="${v}" ${state.answers[state.step]===v?'checked':''}><span>${h(responses[v])}</span></label>`).join('')}</div><div class="f-actions"><div>${state.step?'<button type="button" class="f-link cursor-interaction" data-action="back">← Back</button>':'<button type="button" class="f-link cursor-interaction" data-action="why">Why this direction?</button>'} <button type="button" class="f-link cursor-interaction" data-action="skip">Skip</button></div><button type="button" class="f-primary cursor-interaction" data-action="next" ${state.answers[state.step]?'':'disabled'}>${state.step?'See preview':'Continue →'}</button></div></div><details id="clarify-why"><summary>From Amara’s recorded answers</summary><p class="f-small">“Create special effects for movies” and “Edit movies” were both rated Strongly Like in the 60-item profiler. Neither animation-specific question above was asked in her recorded 24 follow-ups.</p><p class="f-small">Those answers suggest a direction to investigate. They do not establish the work’s distinctive interests or activity contexts.</p></details><p class="f-hint">No answer is preselected. These preview choices will not become facts about Amara.</p>`}
function completion(){const key=state.answers.map(x=>x||'skipped').join('|'),o=data.amara.outcomes[key],yes=state.answers.filter(x=>x==='yes').length,no=state.answers.includes('no'),unknown=state.answers.filter(x=>['unsure','unfamiliar','skipped',null].includes(x)).length;const title=no?'An interest to reconsider':unknown?'Keep this interest open':'Interest evidence is stronger';const explanation=no?'At least one defining interest was declined in this preview.':unknown?'Some defining interests are still unknown in this preview.':'Both defining animation interests were endorsed in this preview.';return `<span class="f-kicker">AMARA · HYPOTHETICAL PREVIEW</span><h1>${title}</h1><p class="f-muted">${explanation}</p><div class="f-result"><span class="f-chip">Still needs confirmation</span><p><strong>Special Effects Artists and Animators</strong></p><span class="f-small">${yes} of 2 interests endorsed · ${o.contexts} activity contexts supported</span></div><p>These two answers alone do not establish a Top match.</p><details open><summary>Next missing context</summary><p><strong>${h(data.amara.contextQuestion.prompt)}</strong></p><p class="f-small f-muted">This question was answered “unfamiliar” in the saved run. We would need an actual response or a small activity to learn more.</p></details><details><summary>Your preview selections</summary>${data.amara.questions.map((q,i)=>`<div class="f-line"><span>${h(q.prompt)}<span class="f-answer">${h(responses[state.answers[i]||'skipped'])}</span></span></div>`).join('')}</details><div class="f-actions"><button type="button" class="f-link cursor-interaction" data-action="restart">Start preview again</button><button type="button" class="cursor-interaction" data-action="morgan">See the shorter results view →</button></div><p class="f-hint">Recorded results remain 0 Top. The preview uses the current support rule; it does not save answers or promote a career.</p>`}
const row=c=>`<div class="f-line"><div><strong>${h(c.title)}</strong><span class="f-answer">${h(c.fields.join(' · '))}</span></div><span class="f-amount">${money(c.entry)}</span></div>`;
function table(list){return `<div class="f-scroll"><table><thead><tr><th>Career</th><th>Recorded support</th><th class="f-number">Est. annual pay</th></tr></thead><tbody>${list.map(c=>`<tr><td><button type="button" class="f-row-button cursor-interaction" data-career="${h(c.id)}">${h(c.title)}</button></td><td>${c.evidenceCount?'Some positive evidence':'Broad interest only'}${c.contraryCount?' · contrary answer':''}</td><td class="f-number">${money(c.entry)}</td></tr>`).join('')}</tbody></table></div>`}
function morgan(){if(state.career){const c=data.morgan.explore.find(c=>c.id===state.career);return `<button type="button" class="f-link cursor-interaction" data-action="results">← Morgan’s focused results</button><p><span class="f-chip">Needs confirmation</span></p><h1>${h(c.title)}</h1><p class="f-muted">${c.evidenceCount} recorded supporting ${c.evidenceCount===1?'item':'items'} · ${money(c.entry)} estimated annual pay</p><h2>What would clarify this?</h2>${c.missing.length?'<ul>'+c.missing.map(q=>'<li>'+h(q)+'</li>').join('')+'</ul>':'<p>Review the remaining activity-context or responsibility requirements.</p>'}<p class="f-hint">This screen does not label the career a Top match.</p>`}return `<span class="f-kicker">MORGAN · PROPOSED RESULTS SCREEN</span><h1>Fewer options. Clearer next steps.</h1><p class="f-muted">Lead with supported matches. Clarify the strongest remaining leads.</p><div class="f-totals"><span><strong>${data.morgan.top.length}</strong> supported Top</span><span><strong>${data.morgan.priority.length}</strong> to clarify</span></div><section><h2>Supported matches</h2><div class="f-panel">${data.morgan.top.map(row).join('')}</div></section><details><summary>${data.morgan.priority.length} candidates worth clarifying</summary><p class="f-small f-muted">Some positive evidence + good broad alignment + no recorded contrary answer. Still unconfirmed.</p>${table(data.morgan.priority)}</details><details><summary>Why the list is shorter</summary><p class="f-small">${data.morgan.noRecordedEvidence} of the original ${data.morgan.explore.length} exploration candidates have no recorded field/profession evidence. An initial screen leaves ${data.morgan.priority.length} review candidates. It is a proposed screening test, not a validated quality threshold.</p><p class="f-small">All supported matches stay. Salary and education level do not raise interest fit. A lower broad score can miss a real connection, so the full list remains available.</p></details><details><summary>Browse all ${data.morgan.explore.length} original exploration candidates</summary>${table(data.morgan.explore)}</details><p class="f-hint">Pay estimates are the recorded first-qualified-role references, before tax. Morgan’s lifestyle target remains ${money(data.morgan.target)} / year; none of these entry-pay estimates meets it.</p>`}
function render(){scene.value=state.scene;view.innerHTML=state.scene==='amara'?amara():morgan();}
function remember(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{design:'a3-clarification-v1',scene:state.scene,step:state.step,done:state.done,previewAnswers:state.answers,career:state.career,hypothetical:true},privateContent:null}).catch(()=>{});}
function restore(x){if(!x||x.design!=='a3-clarification-v1')return;state.scene=['amara','morgan'].includes(x.scene)?x.scene:'amara';state.step=x.step===1?1:0;state.done=x.done===true;if(Array.isArray(x.previewAnswers)&&x.previewAnswers.length===2)state.answers=x.previewAnswers.map(v=>Object.hasOwn(responses,v)?v:null);state.career=data.morgan.explore.some(c=>c.id===x.career)?x.career:null;}
restore(window.openai?.widgetState?.modelContent);render();
scene.addEventListener('change',()=>{state.scene=scene.value;state.career=null;render();remember();});
view.addEventListener('change',e=>{if(e.target.name==='clarify-answer'){state.answers[state.step]=e.target.value;const next=view.querySelector('[data-action="next"]');if(next)next.disabled=false;remember();}});
view.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.career){state.career=b.dataset.career;render();remember();return;}const a=b.dataset.action;if(a==='why'){view.querySelector('#clarify-why').open=true;return;}if(a==='skip')state.answers[state.step]='skipped';if(a==='next'||a==='skip'){if(!state.answers[state.step])return;if(state.step===0)state.step=1;else state.done=true;}else if(a==='back')state.step=0;else if(a==='restart'){state.step=0;state.done=false;state.answers=[null,null];}else if(a==='morgan'){state.scene='morgan';state.career=null;}else if(a==='results')state.career=null;render();remember();});
window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState?.modelContent);render();});
})();
</script>
