ace-between;gap:10px;border-bottom:1px solid var(--fg-line)}

<div class="viz-carousel" aria-label="Connected Approach 3 landing designs">
<section data-variant="Route overview" aria-label="Route overview and connected detail screens"><div class="fg-app" data-start="routes"></div></section>

<script>
(()=>{
const root=document.getElementById('a3-journey');
const careers=[
{id:'mechanical',name:'Mechanical engineer',route:'degree',credential:'Bachelor’s',pay:78,year5:96,top:true,field:'Engineering',path:'Mechanical & manufacturing engineering',check:'Specific design and testing interests are present.'},
{id:'technician',name:'Mechanical engineering technician',route:'associate',credential:'Associate',pay:50,year5:63,top:false,field:'Engineering',path:'Engineering technology',check:'Interest in technical support and recording test results is unknown.'},
{id:'quality',name:'Quality control inspector',route:'no-degree',credential:'No degree',pay:42,year5:53,top:false,field:'Engineering',path:'Workplace training',check:'Interest in repeated inspections and documenting defects is unknown.'},
{id:'repair',name:'Industrial machinery mechanic',route:'training',credential:'Training / apprenticeship',pay:48,year5:64,top:false,field:'Engineering',path:'Industrial maintenance',check:'Interest in repairing production machinery is unknown.'},
{id:'materials',name:'Materials scientist',route:'degree',credential:'Graduate route',pay:72,year5:91,top:false,field:'Science',path:'Chemistry, physics & earth science',check:'Interest in laboratory investigation and material properties is unknown.'},
{id:'environment',name:'Environmental science technician',route:'associate',credential:'Associate',pay:45,year5:58,top:false,field:'Science',path:'Environment, agriculture & food',check:'Interest in sampling, fieldwork and environmental monitoring is unknown.'}
];
const labels={'no-degree':'No college degree',training:'Training / certificate',associate:'Associate degree',degree:'Bachelor’s / graduate'};
const state=new Map();
const fit=c=>`<span class="fg-chip ${c.top?'fg-top':'fg-explore'}">${c.top?'✓ Supported Top':'? Explore'}</span>`;
const budget=(pay)=>`<div class="fg-budget ${pay<43?'fg-short':''}">${pay>=43?'✓':'↓'} $${Math.abs(pay-43)}k / year ${pay>=43?'above':'below'} target</div>`;
const target=()=>'<aside class="fg-target"><span>NEEDED FOR YOUR LIFESTYLE</span><strong>$43k <small>/ year</small></strong></aside>';
const button=(label,view,id='',cls='')=>`<button type="button" class="cursor-interaction ${cls}" data-go="${view}"${id?` data-id="${id}"`:''}>${label}</button>`;
const careerLink=c=>button(c.name,'career',c.id,'fg-match-link');
const routeLead=r=>careers.find(c=>c.route===r);
const flow=current=>`<div class="fg-flow" aria-label="Journey"><span>Lifestyle</span>→<span>60 interest questions</span>→<span>Targeted follow-ups</span>→<span class="${current==='results'?'fg-here':''}">Your options</span>→<span class="${current==='detail'?'fg-here':''}">Explore & compare</span></div>`;
const intro=(title,sub)=>`<div class="fg-intro"><div><span class="fg-kicker">YOUR RESULTS · ELI</span><h1>${title}</h1><p class="fg-sub">${sub}</p></div>${target()}</div>`;
function card(c,r){return `<article class="fg-panel"><div class="fg-panel-title"><h3>${labels[r]}</h3><span>${careers.filter(x=>x.route===r).length} ${careers.filter(x=>x.route===r).length===1?'career':'careers'}</span></div>${r==='degree'?`<div class="fg-path"><span class="fg-tiny">STUDY DIRECTION</span><br>${button(c.path,'study','','fg-link')}</div>`:''}${fit(c)}<h3>${careerLink(c)}</h3><div class="fg-line-row"><span class="fg-tiny">First qualified role</span><span class="fg-pay">$${c.pay}k <small>/ year</small></span></div>${budget(c.pay)}<div class="fg-actions">${button('See options →','all',r,r==='degree'?'fg-primary':'')}${r==='degree'?button('Compare routes','compare','','fg-link'):''}</div></article>`}
function routes(){return `${flow('results')}${intro('Different routes. More possibilities.','Your interests first. Preparation and pay side by side.')}<div class="fg-grid">${['degree','associate','training','no-degree'].map(r=>card(routeLead(r),r)).join('')}</div><div class="fg-section fg-line-row"><div><strong>6 distinct careers across 2 fields</strong><div class="fg-tiny fg-sub">1 supported Top · 5 exploration candidates</div></div>${button('All options →','all')}</div>`}
function matrix(){return `${flow('results')}${intro('Your interests, across every route.','Browse by field without losing sight of alternatives.')}<div class="fg-panel fg-desktop-matrix fg-scroll"><table class="fg-matrix-table"><thead><tr><th>Field</th>${Object.values(labels).map(l=>`<th>${l}</th>`).join('')}</tr></thead><tbody>${['Engineering','Science'].map(f=>`<tr><td>${f}</td>${Object.keys(labels).map(r=>`<td>${careers.filter(c=>c.route===r&&c.field===f).map(c=>`<div class="fg-cell-entry">${fit(c)}<br>${careerLink(c)}<br><strong>$${c.pay}k</strong> / year<br><span class="fg-tiny">${c.pay>=43?'✓ Above target':'↓ Below target'}</span></div>`).join('')||'<span class="fg-sub">No candidate shown</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="fg-mobile-route">${['Engineering','Science'].map(f=>`<div class="fg-panel"><h2>${f}</h2>${careers.filter(c=>c.field===f).map(c=>`<div class="fg-summary-line"><div>${careerLink(c)}<br><span class="fg-tiny">${c.credential}</span> ${fit(c)}</div><strong>$${c.pay}k</strong></div>`).join('')}</div>`).join('')}</div><div class="fg-section fg-grid"><div class="fg-panel"><span class="fg-kicker">WHAT COULD I STUDY?</span><h3>Mechanical & manufacturing engineering</h3><p class="fg-sub">Mechanics · Materials · Design</p>${button('Open study pathway →','study','','fg-primary')}</div><div class="fg-panel"><span class="fg-kicker">WHAT ARE THE TRADE-OFFS?</span><h3>Compare preparation and pay</h3><p class="fg-sub">Include supported and exploration options.</p>${button('Compare routes →','compare')}</div></div>`}
function studyHome(){return `${flow('results')}${intro('A direction, with room to grow.','Explore what you could learn and where it could lead.')}<article class="fg-panel"><span class="fg-kicker">CONNECTED STUDY DIRECTION</span><h2>Mechanical & manufacturing engineering</h2><div class="fg-column"><div><div class="fg-courses"><span>Mechanics</span><span>Materials</span><span>Design</span></div><p class="fg-sub">A broad study connection, alongside one career with specific support.</p>${button('Explore this pathway →','study','','fg-primary')}</div><div class="fg-path">${fit(careers[0])}<h3>${careerLink(careers[0])}</h3><span class="fg-pay">$78k <small>/ year</small></span>${budget(78)}</div></div></article><h2 class="fg-section">Related work through other routes</h2><div class="fg-panel">${careers.slice(1,4).map(c=>`<div class="fg-band"><div><span class="fg-kicker">${labels[c.route]}</span></div><div class="fg-line-row"><div>${careerLink(c)}<br>${fit(c)}</div><strong>$${c.pay}k</strong></div></div>`).join('')}<div class="fg-actions">${button('Compare routes →','compare')}${button('All fields & careers','all','','fg-link')}</div></div><details><summary>Other study directions remain open</summary>${button('Chemistry, physics & earth science','all','degree','fg-link')}<br>Explore coursework and check the interests that are still unknown.</details>`}
function career(s){const c=careers.find(x=>x.id===s.career)||careers[0];return `<div class="fg-breadcrumb">${button('← All results','home','','fg-link')}<span>/ ${c.field}</span></div>${fit(c)}<h1>${c.name}</h1><p class="fg-sub">${c.credential} · ${c.top?'Specific interests support this career.':'Related possibility; more interest evidence is needed.'}</p><div class="fg-hero-pay"><div class="fg-metric"><span>First qualified role</span><strong>$${c.pay}k</strong></div><div class="fg-metric"><span>Needed for your lifestyle</span><strong>$43k</strong></div><div class="fg-metric ${c.pay>=43?'fg-positive':''}"><span>${c.pay>=43?'Above':'Below'} target / year</span><strong>${c.pay>=43?'+':'−'}$${Math.abs(c.pay-43)}k</strong></div></div><div class="fg-grid"><article class="fg-panel"><h2>${c.top?'Why this is supported':'What still needs checking'}</h2>${c.top?'<ul class="fg-evidence"><li>Understanding mechanisms<span>Stated interest</span></li><li>Testing revised parts<span>Stated interest</span></li><li>Comparing design trade-offs<span>Stated interest</span></li></ul>':`<p>${c.check}</p><div class="fg-empty">Unknown ≠ dislike. No answer is filled in for you.</div>`}<details><summary>See the answer connections</summary>${c.top?'Mechanisms + testing + design → engineering work. Each connection would link to the actual structured response.':'Broad related interests suggest exploration. The distinctive responsibility remains unanswered.'}</details></article><article class="fg-panel"><h2>${c.route==='degree'?'What could I study?':'How could I prepare?'}</h2><div class="fg-path"><strong>${c.path}</strong><p class="fg-tiny">${c.route==='degree'?'Study pathway · not a second career match':'Preparation route · verify the specific credential'}</p></div>${c.route==='degree'?button('Explore study pathway →','study',c.id,'fg-primary'):'<p class="fg-sub">Check local training, entry requirements and whether a credential is needed.</p>'}<details><summary>Other routes and later study</summary>Show recognized alternative entry routes separately. A graduate specialization does not become a requirement for an entry role.</details></article></div><div class="fg-actions fg-section">${button('Compare with another route →','compare','','fg-primary')}${button('Browse all options','all','','fg-link')}</div>`}
function study(s){if(s.studyCareer==='materials')return materialsStudy();return `<div class="fg-breadcrumb">${button('← My results','home','','fg-link')}<span>/ Study pathway</span></div><span class="fg-kicker">BACHELOR’S STARTING POINT · GRADUATE OPTIONS LATER</span><h1>Mechanical & manufacturing engineering</h1><p class="fg-sub">A shared foundation for several possible futures.</p><div class="fg-column"><article class="fg-panel"><h2>What you could learn</h2><div class="fg-courses"><span>Mechanics</span><span>Materials</span><span>Engineering design</span><span>Mathematics</span></div><h2 class="fg-section">How the route could unfold</h2><div class="fg-step"><b>1</b><div><strong>Try the subject</strong><p>Introductory design course or a small build-and-test project.</p></div></div><div class="fg-step"><b>2</b><div><strong>Explore bachelor’s programs</strong><p>Compare curriculum and entry requirements.</p></div></div><div class="fg-step"><b>3</b><div><strong>Keep graduate study optional</strong><p>Specialize later if research or advanced work appeals.</p></div></div><details><summary>Could I start at a community college?</summary>Possibly. Check an actual transfer agreement and required courses; an associate credential alone does not qualify every engineering role.</details></article><article class="fg-panel"><h2>Connected careers</h2>${fit(careers[0])}<h3>${careerLink(careers[0])}</h3><div class="fg-line-row"><span>Bachelor’s route</span><strong>$78k / year</strong></div>${budget(78)}<div class="fg-fork"><span class="fg-kicker">ADJACENT PREPARATION</span><p>${careerLink(careers[1])}<br><span class="fg-tiny">Associate · $${careers[1].pay}k / year · Explore</span></p></div><p class="fg-tiny fg-sub">A linked program does not confirm career fit or guarantee qualification.</p>${button('See career evidence →','career','mechanical','fg-primary')}</article></div><div class="fg-section fg-panel"><h3>Not ready to choose a profession?</h3><div class="fg-line-row"><p class="fg-sub">Keep this study direction and compare it with other routes.</p>${button('Compare routes →','compare')}</div></div>`}
function all(s){let rows=careers.filter(c=>!s.route||c.route===s.route);if(s.sort==='salary')rows=rows.slice().sort((a,b)=>b.pay-a.pay);else rows=rows.slice().sort((a,b)=>Number(b.top)-Number(a.top)||b.pay-a.pay);return `<div class="fg-breadcrumb">${button('← Route overview','home','','fg-link')}</div>${intro('All your options. In one place.','Supported matches and exploration candidates stay distinct.')}<div class="fg-toolbar" aria-label="Education routes">${button('All routes','filter','all',!s.route?'fg-primary':'')}${Object.entries(labels).map(([k,v])=>button(v,'filter',k,s.route===k?'fg-primary':'')).join('')}</div><div class="fg-line-row"><span>${rows.length} careers in view</span><label class="fg-tiny">Sort <select data-sort aria-label="Sort careers"><option value="fit" ${s.sort==='fit'?'selected':''}>Match evidence</option><option value="salary" ${s.sort==='salary'?'selected':''}>Entry salary</option></select></label></div><div class="fg-panel fg-scroll"><table><thead><tr><th>Career</th><th>Fit evidence</th><th>Preparation</th><th>Entry pay</th><th>Lifestyle</th></tr></thead><tbody>${rows.map(c=>`<tr><td>${careerLink(c)}<div class="fg-tiny fg-sub">${c.field}</div></td><td>${fit(c)}</td><td>${c.credential}</td><td class="fg-money">$${c.pay}k</td><td>${c.pay>=43?'✓':'↓'} $${Math.abs(c.pay-43)}k ${c.pay>=43?'above':'below'}</td></tr>`).join('')}</tbody></table></div><details><summary>Why are some options still “Explore”?</summary>Broad connections can identify a possible direction. A supported Top also needs evidence for the distinctive work. Selecting a field or pathway does not supply that evidence.</details><div class="fg-actions">${button('Compare routes →','compare','','fg-primary')}${button('View study pathway','study','','fg-link')}</div>`}
function materialsStudy(){const c=careers.find(x=>x.id==='materials');return `<div class="fg-breadcrumb">${button('← My results','home','','fg-link')}<span>/ Study pathway</span></div><span class="fg-kicker">STUDY DIRECTION · INTERESTS TO CHECK</span><h1>Chemistry, physics & earth science</h1><p class="fg-sub">An adjacent direction to investigate, not a confirmed preference.</p><div class="fg-grid"><article class="fg-panel"><h2>Subjects to explore</h2><div class="fg-courses"><span>Chemistry</span><span>Physics</span><span>Material properties</span></div><h2 class="fg-section">A possible preparation route</h2><p>Bachelor’s foundations, followed by graduate study for some research destinations.</p><div class="fg-empty">Interest in laboratory investigation remains unknown.</div></article><article class="fg-panel"><h2>Career to investigate</h2>${fit(c)}<h3>${careerLink(c)}</h3><p class="fg-pay">$72k <small>/ year</small></p>${budget(c.pay)}<p>${c.check}</p>${button('See career evidence →','career',c.id,'fg-primary')}</article></div><div class="fg-actions fg-section">${button('Compare routes →','compare')}${button('Browse all options','all','','fg-link')}</div>`}
function compare(s){const left=careers.find(c=>c.id===s.left)||careers[0],right=careers.find(c=>c.id===s.right)||careers[1];const pane=(c,side)=>{const pay=s.payMode==='five'?c.year5:c.pay;return `<article class="fg-panel"><label class="fg-choice-label">${side==='left'?'Bachelor’s / graduate':'No degree / training / associate'}</label><select data-compare="${side}" aria-label="${side==='left'?'Choose bachelor or graduate career':'Choose non-bachelor career'}">${careers.filter(x=>side==='left'?x.route==='degree':x.route!=='degree').map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${x.name} · ${x.top?'Top':'Explore'}</option>`).join('')}</select>${fit(c)}<h3>${c.name}</h3><span class="fg-pay">$${pay}k <small>/ year</small></span><div class="fg-pay-track" role="img" aria-label="${pay} thousand annual income; target 43 thousand on a zero to 100 thousand scale"><div class="fg-pay-fill" style="width:${pay}%"></div></div><div class="fg-pay-axis"><span>$0</span><span>Target $43k</span><span>$100k</span></div>${budget(pay)}<div class="fg-summary-line"><span>Preparation</span><strong>${c.credential}</strong></div><div class="fg-summary-line"><span>Interest evidence</span><strong>${c.top?'Supported':'Needs checking'}</strong></div><details><summary>${c.top?'Why this fits':'What is unknown?'}</summary>${c.check}</details>${button(c.route==='degree'?'See study pathway →':'See career details →',c.route==='degree'?'study':'career',c.id,'fg-link')}</article>`};return `<div class="fg-breadcrumb">${button('← My results','home','','fg-link')}</div>${intro('Different routes. Clear trade-offs.','Compare careers you could explore, not the “salary of a degree.”')}<div class="fg-toolbar"><button type="button" data-pay="entry" aria-pressed="${s.payMode==='entry'}">First qualified role</button><button type="button" data-pay="five" aria-pressed="${s.payMode==='five'}">After 5 working years · scenario</button></div><div class="fg-grid">${pane(left,'left')}${pane(right,'right')}</div><p class="fg-tiny fg-sub">Annual pay before tax. Five-year scenarios start after qualification; preparation time and education costs are separate.</p><details><summary>Compare the cost and time to qualify</summary>Next design layer: verified program duration, tuition, aid and possible earnings while training. No cost or time estimates have been assumed here.</details>`}
function render(app){const s=state.get(app);const home=s.start==='routes'?routes:s.start==='matrix'?matrix:studyHome;const view=s.view==='home'?home():s.view==='career'?career(s):s.view==='study'?study(s):s.view==='compare'?compare(s):all(s);app.innerHTML=`<header><div class="fg-brand"><span class="fg-logo">↗</span>Fieldguide</div><nav aria-label="Results navigation"><button type="button" data-go="home" aria-current="${s.view==='home'?'page':'false'}">My results</button><button type="button" data-go="all" aria-current="${s.view==='all'?'page':'false'}">All options</button><button type="button" data-go="compare" aria-current="${s.view==='compare'?'page':'false'}">Compare routes</button></nav></header><main aria-live="polite">${view}</main><div class="fg-example-note">APPROACH 3 DESIGN SAMPLE · Fictional recommendations and pay for interface exploration. No live matching or account changes.</div>`;}
function remember(app){const s=state.get(app);if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{concept:s.start,screen:s.view,selectedCareer:s.career,studyCareer:s.studyCareer,comparison:[s.left,s.right],payMode:s.payMode},privateContent:null}).catch(()=>{});}
root.querySelectorAll('.fg-app').forEach(app=>{const s={start:app.dataset.start,view:'home',career:'mechanical',studyCareer:'mechanical',left:'mechanical',right:'technician',route:'',sort:'fit',payMode:'entry'};const saved=window.openai?.widgetState?.modelContent;if(saved?.concept===s.start&&['home','career','study','compare','all'].includes(saved.screen)){s.view=saved.screen;if(careers.some(c=>c.id===saved.selectedCareer))s.career=saved.selectedCareer;if(careers.some(c=>c.id===saved.studyCareer&&c.route==='degree'))s.studyCareer=saved.studyCareer;if(['entry','five'].includes(saved.payMode))s.payMode=saved.payMode;if(Array.isArray(saved.comparison)&&saved.comparison.length===2){if(careers.some(c=>c.id===saved.comparison[0]&&c.route==='degree'))s.left=saved.comparison[0];if(careers.some(c=>c.id===saved.comparison[1]&&c.route!=='degree'))s.right=saved.comparison[1];}}state.set(app,s);render(app);app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){if(b.dataset.go==='filter'){s.route=b.dataset.id==='all'?'':b.dataset.id;s.view='all';}else{s.view=b.dataset.go;if(s.view==='career')s.career=b.dataset.id||'mechanical';if(s.view==='study')s.studyCareer=b.dataset.id||'mechanical';if(s.view==='all')s.route=b.dataset.id||'';}render(app);remember(app);}else if(b.dataset.pay){s.payMode=b.dataset.pay;render(app);remember(app);}});app.addEventListener('change',e=>{if(e.target.dataset.compare){s[e.target.dataset.compare]=e.target.value;render(app);remember(app);}else if(e.target.hasAttribute('data-sort')){s.sort=e.target.value;render(app);remember(app);}});});
window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState?.modelContent;if(!saved)return;root.querySelectorAll('.fg-app').forEach(app=>{const s=state.get(app);if(saved.concept!==s.start||!['home','career','study','compare','all'].includes(saved.screen))return;s.view=saved.screen;if(careers.some(c=>c.id===saved.selectedCareer))s.career=saved.selectedCareer;if(careers.some(c=>c.id===saved.studyCareer&&c.route==='degree'))s.studyCareer=saved.studyCareer;render(app);});});
if(globalThis.Tweak){const design={showJourney:true};const apply=()=>root.classList.toggle('fg-no-flow',!design.showJourney);const tweak=new Tweak({container:root,onChange:apply});tweak.addToggle(design,'showJourney',{label:'Show completed journey strip'});}
})();
</script>
</div>
