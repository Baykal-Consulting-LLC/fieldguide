<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hybrid opening review</title><style>body{font:17px system-ui;color:#173d31;background:#fafbf7;max-width:1100px;margin:24px auto;padding:16px}select,input{font:inherit;padding:10px;max-width:100%}article{padding:18px 0;border-bottom:1px solid #bbc9c0}li{margin:12px 0;line-height:1.5}summary{cursor:pointer;font-weight:650}blockquote{margin:10px 0;padding-left:12px;border-left:3px solid #668b76}.controls{display:flex;gap:16px;flex-wrap:wrap}a{color:#174e3b}</style><nav><a href="performance/">← Dashboard</a> · <a href="fresh-start-095.html?study=103&budget=24">Experimental match chart</a> · <a href="fresh-start-095.html?study=100&budget=24">Accepted baseline</a></nav><h1>Hybrid opening · case review</h1><p>Fresh 60 + 24. Same questions and scoring; both arms use corrected architecture answers. Hybrid also changes question selection. Live flow unchanged. Inspected holdouts remain separate.</p><p id="meta"></p><section id="findings"></section><div class="controls"><label>Split <select id="cohort"><option value="all">Both cohorts · separate labels</option><option>development</option><option>holdout</option><option>holdout049</option><option>holdout056</option><option>grok075</option></select></label><label>Change <select id="kind"><option value="all">All career changes</option><option value="gainedTop">Gained Top</option><option value="lostTop">Lost Top</option><option value="gainedDegree">Gained degree Top</option><option value="lostDegree">Lost degree Top</option></select></label><label>Find model <input id="search" type="search"></label></div><p id="count"></p><div id="rows">Loading…</div><script type="module">import{fetchCohortJSON}from'../current-cohort-loader.js';const[d,cat]=await Promise.all([fetchCohortJSON('./opening-review-103.json.gz'),fetchCohortJSON('./evidence-103.json.gz')]),titles=new Map(cat.careers),h=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.querySelector('#meta').textContent='Frozen candidate: '+d.freeze.selected+'. '+d.sampleNote;document.querySelector('#findings').innerHTML='<details><summary>Rejected field-wide cap test · development only</summary>'+d.rejectedDevelopment.map(v=>'<p>'+h(v.mode)+': '+v.top+' Top · '+v.degree+' degree Top of758.</p>').join('')+'<p>Hard caps blocked genuine alternatives. Replaced by a bounded detour before any holdout evaluation; not used in the final cohort test.</p></details>'+'<h2>Architecture correction</h2><p>'+d.architectureCases.length+' models had architecture in their uncorrected Top. Building-specific responsibilities remain unknown.</p><details><summary>Inspect affected architecture models</summary>'+d.architectureCases.map(c=>'<article><b>'+h(c.name)+' · '+h(c.id)+' · '+h(c.cohort)+'</b><p>Uncorrected: '+c.uncorrected.map(id=>h(titles.get(id)||id)).join(', ')+'</p><p>Corrected current: '+(c.corrected.map(id=>h(titles.get(id)||id)).join(', ')||'No Top')+'</p><p>Hybrid: '+(c.hybrid.map(id=>h(titles.get(id)||id)).join(', ')||'No Top')+'</p></article>').join('')+'</details>'+'<h2>Removed career diagnostic</h2>'+d.lossDiagnostics.filter(x=>['all','grok075','holdout'].includes(x.cohort)).map(x=>'<p><b>'+h(x.cohort)+'</b>: '+x.removedCareers+' removed Top careers; '+x.stillSupported+' still supported outside Top3; '+x.missingSpecific+' missing previously asked career-specific checks; '+x.otherEvidence+' other activity-evidence changes.</p>').join('')+'<h2>Reviewed cases</h2>'+d.qualitative.cases.map(c=>'<p><b>'+h(c.id)+'</b>: '+h(c.finding)+' '+h(c.interpretation)+'</p>').join('')+'<p><b>Proposed next test:</b> '+h(d.qualitative.nextProposal)+'</p>';const controls=['cohort','kind','search'].map(id=>document.getElementById(id));function render(){const[cohort,kind,search]=controls.map(e=>e.value),rs=d.cases.filter(c=>(cohort==='all'||c.cohort===cohort)&&(kind==='all'||c[kind])&&(!search||(c.id+' '+c.name).toLowerCase().includes(search.toLowerCase())));document.getElementById('count').textContent=rs.length+' changed models · showing first 50';document.getElementById('rows').innerHTML=rs.slice(0,50).map(c=>'<article><h2>'+h(c.name)+' · '+h(c.id)+'</h2><p>'+h(c.cohort)+'</p><p><a href="/developer/model-lab.html?case='+encodeURIComponent(c.id)+'">Original profile and saved answers</a></p><p><b>Corrected current block:</b> '+(c.before.map(id=>h(titles.get(id)||id)).join(', ')||'No supported Top')+'</p><p><b>Hybrid:</b> '+(c.after.map(id=>h(titles.get(id)||id)).join(', ')||'No supported Top')+'</p>'+(c.answers?'<details><summary>Current 24 questions and exact source evidence</summary><ol>'+c.answers.map(a=>'<li><b>'+h(a.prompt)+'</b><br>'+h(a.unknown?'Unknown':a.response)+(a.selectedText?.length?' · '+a.selectedText.map(h).join('; '):'')+(a.evidenceRefs||[]).filter(x=>x.quote).map(x=>'<blockquote>“'+h(x.quote)+'”</blockquote>').join('')+'</li>').join('')+'</ol></details>':'')+'</article>').join('');}controls.forEach(e=>e.oninput=render);render();</script></html>
