<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Question replacement review</title><style>body{font:17px system-ui;max-width:1100px;margin:30px auto;padding:16px;color:#173d31;background:#fafbf7}select,input{font:inherit;padding:10px}article{border-bottom:1px solid #ccd4cc;padding:16px 0}summary{cursor:pointer}li{margin:14px 0}blockquote{border-left:3px solid #567d66;padding-left:12px}nav,.controls{display:flex;gap:16px;flex-wrap:wrap}</style><nav><a href="performance/">Dashboard</a><a href="fresh-start-095.html?study=104&budget=24">Replacement matches</a><a href="fresh-start-095.html?study=104&arm=control&budget=24">Current matches</a></nav><h1>Question replacements · fresh 60 + 24</h1><p>Existing activity questions replace low-information activity slots. Initial leads and specific confirmations are protected. No invented answers or new profile facts. Live flow unchanged.</p><p id="meta"></p><div class="controls"><label>Split <select id="cohort"><option value="all">Both cohorts</option><option>development</option><option>holdout</option><option>holdout049</option><option>holdout056</option><option>grok075</option></select></label><label>Change <select id="kind"><option value="all">All replacements and career changes</option><option value="gainedTop">Gained Top</option><option value="lostTop">Lost Top</option><option value="gainedDegree">Gained degree Top</option><option value="lostDegree">Lost degree Top</option></select></label><input id="search" type="search" placeholder="Find model"></div><p id="count"></p><div id="rows">Loading…</div><script type="module">import{fetchCohortJSON}from'../current-cohort-loader.js';const[d,cat]=await Promise.all([fetchCohortJSON('./replacement-review-104.json.gz'),fetchCohortJSON('./evidence-104.json.gz')]),titles=new Map(cat.careers),h=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('meta').textContent='Frozen candidate: '+d.freeze.selected+'. Development-only simulator availability estimates; not validated human information gain. Exact traces shown for up to two gain/loss cases per category and split; all replacements and career changes retained. Holdouts were already inspected and remain separate.';const controls=['cohort','kind','search'].map(id=>document.getElementById(id));function render(){const[c,k,s]=controls.map(x=>x.value),rs=d.cases.filter(x=>(c==='all'||x.cohort===c)&&(k==='all'||x[k])&&(!s||(x.id+' '+x.name).toLowerCase().includes(s.toLowerCase())));document.getElementById('count').textContent=rs.length+' models · showing first 50';document.getElementById('rows').innerHTML=rs.slice(0,50).map(x=>'<article><h2>'+h(x.name)+' · '+h(x.id)+'</h2><p>'+h(x.cohort)+'</p><p>Current: '+(x.before.map(id=>h(titles.get(id)||id)).join(', ')||'No Top')+'</p><p>Replacement: '+(x.after.map(id=>h(titles.get(id)||id)).join(', ')||'No Top')+'</p><p>'+x.replacements.map(a=>h(a.from)+' → '+h(a.id)+(a.unknown?' (unknown)':'')).join('<br>')+'</p><details><summary>All 24 fresh follow-ups and source evidence</summary><ol>'+x.answers.map(a=>'<li><b>'+h(a.prompt)+'</b><br>'+h(a.unknown?'Unknown':a.response)+(a.evidenceRefs||[]).filter(e=>e.quote).map(e=>'<blockquote>'+h(e.quote)+'</blockquote>').join('')+'</li>').join('')+'</ol></details>':'<p>Full traces retained in the reproducible research output.</p>')+'</article>').join('');}controls.forEach(x=>x.oninput=render);render();</script></html>
